<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="920" height="260" fill="#ffffff"/>

  <!-- Main Queue -->
  <rect x="24" y="96" width="150" height="58" rx="4" fill="#eeeeee" stroke="#999999"/>
  <text x="99" y="121" text-anchor="middle" fill="#111111" font-weight="bold">Main Queue</text>
  <text x="99" y="139" text-anchor="middle" fill="#555555" font-size="11">(visibility timeout)</text>

  <!-- Worker -->
  <rect x="265" y="96" width="165" height="58" rx="4" fill="#eeeeee" stroke="#999999"/>
  <text x="347" y="121" text-anchor="middle" fill="#111111" font-weight="bold">Consumer / Worker</text>
  <text x="347" y="139" text-anchor="middle" fill="#555555" font-size="11">proses pesan (idempotent)</text>

  <!-- Decision -->
  <rect x="520" y="96" width="145" height="58" rx="4" fill="#e8f4fd" stroke="#5b9bd5"/>
  <text x="592" y="121" text-anchor="middle" fill="#111111" font-weight="bold">Hasil Eksekusi?</text>
  <text x="592" y="139" text-anchor="middle" fill="#555555" font-size="11">cek jenis error &amp; batas</text>

  <!-- Success -->
  <rect x="740" y="24" width="160" height="52" rx="4" fill="#eaf7ee" stroke="#5cb85c"/>
  <text x="820" y="46" text-anchor="middle" fill="#111111" font-weight="bold">ACK &amp; Hapus Pesan</text>
  <text x="820" y="64" text-anchor="middle" fill="#444444" font-size="11">selesai diproses</text>

  <!-- DLQ -->
  <rect x="740" y="176" width="160" height="60" rx="4" fill="#fdecea" stroke="#d9534f"/>
  <text x="820" y="199" text-anchor="middle" fill="#991b1b" font-weight="bold">Dead-Letter Queue</text>
  <text x="820" y="216" text-anchor="middle" fill="#444444" font-size="11">alert, inspeksi &amp; replay</text>

  <!-- Arrows -->
  <line x1="174" y1="125" x2="263" y2="125" stroke="#555555" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="218" y="117" text-anchor="middle" fill="#333333" font-size="11">1. ambil pesan</text>

  <line x1="430" y1="125" x2="518" y2="125" stroke="#555555" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="474" y="117" text-anchor="middle" fill="#333333" font-size="11">2. evaluasi</text>

  <!-- Success branch -->
  <path d="M 665 112 L 700 112 L 700 50 L 738 50" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="694" y="42" text-anchor="end" fill="#1b6e32" font-size="11" font-weight="bold">Sukses</text>

  <!-- Permanent / Max retry -> DLQ -->
  <path d="M 665 138 L 700 138 L 700 206 L 738 206" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="694" y="232" text-anchor="end" fill="#991b1b" font-size="11">Gagal permanen / &gt; max retry</text>

  <!-- Transient failure loop back to Main Queue -->
  <path d="M 592 96 L 592 38 L 99 38 L 99 94" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="345" y="29" text-anchor="middle" fill="#8a5a00" font-size="11">Gagal sementara (&lt; max delivery count): muncul kembali setelah visibility timeout</text>
</svg>
