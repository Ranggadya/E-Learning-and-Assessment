  <text x="700" y="186" text-anchor="middle" fill="#111111" font-weight="bold">Function</text>
  <text x="700" y="202" text-anchor="middle" fill="#444444" font-size="11">(Lambda / Functions)</text>

  <rect x="780" y="148" width="125" height="62" rx="4" fill="#eaf7ee" stroke="#5cb85c"/>
