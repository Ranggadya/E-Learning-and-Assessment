  <text x="517" y="74" text-anchor="middle" fill="#111111">butuh K8s API?</text>

  <rect x="435" y="138" width="165" height="52" rx="4" fill="#e8f4fd" stroke="#5b9bd5"/>
  <text x="517" y="160" text-anchor="middle" fill="#111111" font-weight="bold">Kubernetes</text>
  <text x="517" y="178" text-anchor="middle" fill="#444444" font-size="12">(Job / CronJob)</text>

  <rect x="655" y="34" width="240" height="52" rx="4" fill="#eeeeee" stroke="#999999"/>
