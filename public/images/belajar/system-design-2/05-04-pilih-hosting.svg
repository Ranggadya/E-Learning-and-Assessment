  <text x="95" y="74" text-anchor="middle" fill="#111111">paralel ribuan VM?</text>

  <rect x="20" y="138" width="150" height="52" rx="4" fill="#e8f4fd" stroke="#5b9bd5"/>
  <text x="95" y="160" text-anchor="middle" fill="#111111" font-weight="bold">Batch / HPC</text>
  <text x="95" y="178" text-anchor="middle" fill="#444444" font-size="12">(AWS / Azure Batch)</text>

  <rect x="225" y="34" width="155" height="52" rx="4" fill="#eeeeee" stroke="#999999"/>
  <text x="302" y="56" text-anchor="middle" fill="#111111" font-weight="bold">Butuh OS penuh /</text>
  <text x="302" y="74" text-anchor="middle" fill="#111111">service khusus?</text>

