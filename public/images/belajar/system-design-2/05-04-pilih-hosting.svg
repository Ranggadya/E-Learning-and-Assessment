  <text x="842" y="186" text-anchor="middle" fill="#111111" font-weight="bold">Serverless</text>
  <text x="842" y="202" text-anchor="middle" fill="#444444" font-size="11">(Cloud Run / Fargate)</text>

  <rect x="270" y="262" width="380" height="54" rx="4" fill="#fff8e6" stroke="#d6a127"/>
